<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>MRZ Scanner</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1>MRZ Scanner</h1>

      <div class="input-row">
        <label for="photo" class="btn btn-primary">
          Upload Image
          <input type="file" id="photo" name="photo" accept="image/png, image/jpeg" />
        </label>
        <button id="camera-btn" class="btn btn-secondary">Start Camera</button>
      </div>

      <div id="camera-container" class="camera-container hidden">
        <div class="video-wrap">
          <video id="video" autoplay playsinline></video>
          <canvas id="overlay" class="overlay"></canvas>
        </div>
        <div class="camera-controls">
          <button id="stop-btn" class="btn btn-secondary">Stop Camera</button>
        </div>
        <div id="camera-status" class="camera-status"></div>
      </div>

      <div id="status" class="status hidden">
        <div class="status-text"></div>
        <progress></progress>
      </div>
      <div id="result"></div>
      <div id="preview"></div>
    </div>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
